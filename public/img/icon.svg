<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- Stylized anime-slash "K" -->
  <g filter="url(#glow)">
    <!-- Vertical powerful slash -->
    <path d="M 180 120 L 140 390 L 190 400 L 230 130 Z" fill="url(#flame)" />
    <!-- Top diagonal slash -->
    <path d="M 190 280 L 340 130 L 380 150 L 220 310 Z" fill="url(#flame)" />
    <!-- Bottom diagonal slash -->
    <path d="M 200 260 L 360 410 L 390 380 L 240 240 Z" fill="url(#flame)" />
  </g>
  
  <!-- White intense core to make it look like a glowing blade -->
  <path d="M 180 140 L 160 370 L 175 375 L 195 145 Z" fill="#ffffff" opacity="0.8" />
</svg>
